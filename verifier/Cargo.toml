[package]
name = "asset-verify"
version = "0.1.0"
edition = "2021"
description = "Offline verifier for signed asset bundles (minisign)"

[[bin]]
name = "asset-verify"
path = "src/main.rs"

[dependencies]
minisign-verify = "0.2"
sha2 = "0.10"

[profile.release]
strip = true
lto = true
opt-level = "z"
