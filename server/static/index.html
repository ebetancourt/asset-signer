<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>asset-signer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    max-width: 640px;
    margin: 4rem auto;
    padding: 0 1.5rem;
    line-height: 1.5;
  }
  h1 { font-size: 1.4rem; }
  p.sub { color: #888; margin-top: -0.5rem; }
  #drop {
    border: 2px dashed #888;
    border-radius: 10px;
    padding: 2.5rem 1rem;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
  }
  #drop.hover { border-color: #4a90d9; background: rgba(74, 144, 217, 0.08); }
  #fileList { margin: 1rem 0; padding: 0; list-style: none; }
  #fileList li {
    font-family: ui-monospace, monospace;
    font-size: 0.9rem;
    padding: 0.25rem 0;
  }
  button {
    font-size: 1rem;
    padding: 0.6rem 1.2rem;
    border-radius: 6px;
    border: none;
    background: #4a90d9;
    color: white;
    cursor: pointer;
  }
  button:disabled { background: #999; cursor: not-allowed; }
  #status { margin-top: 1rem; font-size: 0.9rem; }
  #status.error { color: #d94a4a; }
  #status.ok { color: #3a9a4a; }
  input[type=file] { display: none; }
</style>
</head>
<body>
  <h1>asset-signer</h1>
  <p class="sub">Upload files, get back a signed, offline-verifiable bundle.</p>

  <div id="drop">
    <p>Drop files here, or click to choose</p>
    <input type="file" id="fileInput" multiple>
  </div>

  <ul id="fileList"></ul>

  <button id="submit" disabled>Build signed bundle</button>
  <div id="status"></div>

<script>
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('fileInput');
  const fileList = document.getElementById('fileList');
  const submitBtn = document.getElementById('submit');
  const status = document.getElementById('status');

  let selected = [];

  function renderFiles() {
    fileList.innerHTML = '';
    for (const f of selected) {
      const li = document.createElement('li');
      li.textContent = `${f.name} (${f.size.toLocaleString()} bytes)`;
      fileList.appendChild(li);
    }
    submitBtn.disabled = selected.length === 0;
  }

  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('hover'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('hover'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    drop.classList.remove('hover');
    selected = [...e.dataTransfer.files];
    renderFiles();
  });
  fileInput.addEventListener('change', () => {
    selected = [...fileInput.files];
    renderFiles();
  });

  submitBtn.addEventListener('click', async () => {
    status.textContent = 'Signing...';
    status.className = '';
    submitBtn.disabled = true;

    const form = new FormData();
    for (const f of selected) form.append('files', f);

    try {
      const res = await fetch('/api/bundle', { method: 'POST', body: form });
      if (!res.ok) {
        const detail = await res.json().catch(() => ({}));
        throw new Error(detail.detail || `HTTP ${res.status}`);
      }
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'signed-bundle.zip';
      a.click();
      URL.revokeObjectURL(url);
      status.textContent = 'Done — download started.';
      status.className = 'ok';
    } catch (err) {
      status.textContent = `Failed: ${err.message}`;
      status.className = 'error';
    } finally {
      submitBtn.disabled = selected.length === 0;
    }
  });
</script>
</body>
</html>
