[project]
name = "asset-signer-server"
version = "0.1.0"
description = "Web upload form + API that wraps the signer pipeline into a downloadable signed bundle"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["asset_signer_server"]
